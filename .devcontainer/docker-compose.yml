services:
  python:
    build:
      context: ../
      dockerfile: .devcontainer/infra/python/Dockerfile
    env_file:
      - .env
    init: true
    tty: true
    volumes:
      - ../:/home/dev/data
      # ゲームのセーブフォルダーを直接編集する（存在しないパスは作成しない）。
      - type: bind
        source: ${FILE_PATH}
        target: /home/dev/data/src
        bind:
          create_host_path: false
      - ${HOME}/.gitconfig:/data/.gitconfig:ro
      - ${HOME}/.codex:/home/dev/.codex
      - ${HOME}/.claude:/home/dev/.claude
      - ${HOME}/.config/gh:/home/dev/.config/gh:ro
